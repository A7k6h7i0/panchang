    sdk: flutter
  webview_flutter: ^4.13.1
  facebook_app_events: ^0.26.0
  cupertino_icons: ^1.0.8
  flutter_compass: ^0.8.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  alarm: ^5.2.1
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
